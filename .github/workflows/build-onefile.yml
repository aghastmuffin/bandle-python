name: Build onefile executables

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: bandle-linux
            binary_name: bandle
            release_binary_name: bandle-linux
            data_sep: ':'
            ext: ''
          - os: macos-latest
            artifact_name: bandle-macos
            binary_name: bandle
            release_binary_name: bandle-macos
            data_sep: ':'
            ext: ''
          - os: windows-latest
            artifact_name: bandle-windows
            binary_name: bandle.exe
            release_binary_name: bandle-windows.exe
            data_sep: ';'
            ext: '.exe'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller PyQt6

      - name: Download Astral uv (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          curl -L -o uv.tar.gz https://github.com/astral-sh/uv/releases/latest/download/uv-aarch64-apple-darwin.tar.gz
          tar -xzf uv.tar.gz
          mv uv-aarch64-apple-darwin/uv .

      - name: Download Astral uv (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          curl -L -o uv.tar.gz https://github.com/astral-sh/uv/releases/latest/download/uv-x86_64-unknown-linux-musl.tar.gz
          tar -xzf uv.tar.gz
          mv uv-x86_64-unknown-linux-musl/uv .

      - name: Download Astral uv (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          curl -L -o uv.zip https://github.com/astral-sh/uv/releases/latest/download/uv-x86_64-pc-windows-msvc.zip
          python -c "import zipfile; zipfile.ZipFile('uv.zip').extractall('.')"
          mv uv-x86_64-pc-windows-msvc/uv.exe .

      - name: Build onefile launcher
        run: >-
          pyinstaller
          --name bandle
          --onefile
          --windowed
          --clean
          --noconfirm
          --add-data "app.py${{ matrix.data_sep }}."
          --add-data "downloader.py${{ matrix.data_sep }}."
          --add-data "runtime_env.py${{ matrix.data_sep }}."
          --add-data "runtime-requirements.txt${{ matrix.data_sep }}."
          --add-data "uv${{ matrix.ext }}${{ matrix.data_sep }}."
          launcher.py

      - name: Rename binary for release
        run: |
          python -c "import os; os.rename('dist/${{ matrix.binary_name }}', 'dist/${{ matrix.release_binary_name }}')"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.release_binary_name }}

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.release_binary_name }}
