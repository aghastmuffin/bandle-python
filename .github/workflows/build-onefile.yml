name: Build onefile executables

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-onefile.yml'
      - 'launcher.py'
      - 'runtime_env.py'
      - 'runtime-requirements.txt'
      - 'app.py'

jobs:
  build:
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: bandle-linux
            binary_name: bandle
            data_sep: ':'
          - os: macos-latest
            artifact_name: bandle-macos
            binary_name: bandle
            data_sep: ':'
          - os: windows-latest
            artifact_name: bandle-windows
            binary_name: bandle.exe
            data_sep: ';'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: Build onefile launcher
        run: >-
          pyinstaller
          --name bandle
          --onefile
          --windowed
          --clean
          --noconfirm
          --add-data "app.py${{ matrix.data_sep }}."
          --add-data "runtime_env.py${{ matrix.data_sep }}."
          --add-data "runtime-requirements.txt${{ matrix.data_sep }}."
          launcher.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.binary_name }}
